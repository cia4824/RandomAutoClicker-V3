name: Build Android APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Tai ma nguon
        uses: actions/checkout@v4

      - name: Cai dat JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Cau hinh Android SDK va Gradle 8.5
        run: |
          SDK_DIR="${ANDROID_HOME:-$ANDROID_SDK_ROOT}"
          echo "sdk.dir=$SDK_DIR" > local.properties
          yes | "$SDK_DIR/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null 2>&1 || true
          curl -fsSL https://services.gradle.org/distributions/gradle-8.5-bin.zip -o /tmp/gradle.zip
          unzip -q -o /tmp/gradle.zip -d /tmp

      - name: Bien dich file APK (Debug)
        run: /tmp/gradle-8.5/bin/gradle assembleDebug --no-daemon

      - name: Xuat file APK len GitHub Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: RandomAutoClicker-APK
          path: app/build/outputs/apk/debug/*.apk
